{{- if not (has .Values.db.type (list "sqlite" "postgres" "mysql")) }}
{{- fail "db.type must be one of sqlite, postgres, or mysql" }}
{{- end }}
{{- if and .Values.secret.create (ne .Values.db.type "sqlite") (empty .Values.db.dsn) }}
{{- fail "db.dsn is required when secret.create is true and db.type is not sqlite" }}
{{- end }}
{{- if .Values.secret.create }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "kube-osprey.secret" .) -}}
{{- $encryptKey := .Values.encryptKey | default (randAlphaNum 48) -}}
{{- $jwtSecret := .Values.jwtSecret -}}
{{- if $existing }}
{{- $existingKey := index $existing.data "KUBE_OSPREY_ENCRYPT_KEY" -}}
{{- if not $existingKey }}
{{- fail "existing Kite Secret is missing KUBE_OSPREY_ENCRYPT_KEY" }}
{{- end }}
{{- $encryptKey = ($existingKey | b64dec) -}}
{{- if not $jwtSecret }}
{{- $existingJWT := index $existing.data "JWT_SECRET" -}}
{{- if $existingJWT }}
{{- $jwtSecret = ($existingJWT | b64dec) -}}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-osprey.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-osprey.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $jwtSecret }}
  JWT_SECRET: {{ $jwtSecret | b64enc | quote }}
  {{- end }}
  KUBE_OSPREY_ENCRYPT_KEY: {{ $encryptKey | b64enc | quote }}
  {{- if ne .Values.db.type "sqlite" }}
  DB_TYPE: {{ .Values.db.type | b64enc | quote }}
  DB_DSN: {{ .Values.db.dsn | b64enc | quote }}
  {{- end }}
{{- end }}