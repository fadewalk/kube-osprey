<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254">
  <defs>
    <linearGradient id="ringFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1769e0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1769e0" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- orbit rings -->
  <g fill="none" stroke="url(#ringFade)">
    <ellipse cx="627" cy="627" rx="560" ry="225" transform="rotate(-18 627 627)" stroke-width="1.5"/>
    <ellipse cx="627" cy="627" rx="470" ry="330" transform="rotate(22 627 627)" stroke-width="1.5"/>
    <ellipse cx="627" cy="627" rx="330" ry="452" transform="rotate(-8 627 627)" stroke-width="1.5"/>
  </g>

  <!-- orbit nodes: small cluster dots -->
  <g>
    <circle cx="180" cy="770" r="10" fill="#1769e0" opacity="0.8"/>
    <circle cx="1080" cy="420" r="8" fill="#1769e0" opacity="0.55"/>
    <circle cx="960" cy="985" r="9" fill="#01936A" opacity="0.7"/>
    <circle cx="300" cy="330" r="7" fill="#01936A" opacity="0.55"/>
    <circle cx="700" cy="120" r="6" fill="#1769e0" opacity="0.45"/>
    <rect x="1010" y="820" width="26" height="26" rx="4" fill="none" stroke="#1769e0" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="240" y="540" width="20" height="20" rx="4" fill="none" stroke="#1769e0" stroke-opacity="0.4" stroke-width="2"/>
  </g>

  <!-- orbit labels -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="26" letter-spacing="6" fill="#6d8fd1" opacity="0.75">
    <text x="150" y="960">NODES</text>
    <text x="990" y="250">PODS</text>
    <text x="120" y="300">SERVICES</text>
    <text x="900" y="1090">CLUSTERS</text>
  </g>

  <!-- center brand mark: osprey bird in brand circle -->
  <g transform="translate(407 407) scale(0.86)">
    <circle cx="256" cy="256" r="252" fill="#0A3BB2"/>
    <circle cx="256" cy="256" r="252" fill="none" stroke="#1769e0" stroke-opacity="0.6" stroke-width="6"/>
    <path fill="#FFFFFF" d="M256 96
      C 200 60 130 48 60 76
      C 120 96 168 130 200 180
      C 216 206 228 236 236 268
      L 200 420
      L 256 360
      L 312 420
      L 276 268
      C 284 236 296 206 312 180
      C 344 130 392 96 452 76
      C 382 48 312 60 256 96 Z"/>
    <circle cx="256" cy="118" r="15" fill="#01936A"/>
  </g>
