name: Bug report
description: Report a problem with KubeOsprey
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the
        details below — without version and reproduction info we usually
        cannot debug the report.
  - type: input
    id: version
    attributes:
      label: KubeOsprey version
      description: From the UI footer, `GET /api/v1/version`, or the release tag.
      placeholder: v0.17.1
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment type
      options:
        - Helm chart
        - Docker / binary
        - Built from source
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        KubeOsprey server log lines or browser console errors.
        ⚠️ Redact kubeconfigs, tokens, API keys and secrets first.
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have redacted secrets (kubeconfigs, tokens, keys) from logs and screenshots
          required: true
        - label: I have searched existing issues for duplicates
          required: true
